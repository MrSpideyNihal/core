name: FreeBSD Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - develop
    tags:
      - v*.*.*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: FreeBSD Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TODO: Implement more architectures and versions matrix
        # TODO: Implement OpenBSD, Haiku, OmniOS
        build: [debug, relwithdebinfo, release]
        arch: [x86-64, arm64]
        sanitizer: ["", "address-sanitizer", "thread-sanitizer", "clangmsan memory-sanitizer"]
        exclude:
          - build: release
            sanitizer: address-sanitizer
          - build: release
            sanitizer: thread-sanitizer
          - build: release
            sanitizer: clangmsan memory-sanitizer
        # TODO: Implement support for arm64 of c and wasm
        include:
          - arch: x86-64
            extra-loaders: "c wasm"
    steps:
      - name: Free Disk Space
        if: matrix.sanitizer == 'clangmsan memory-sanitizer'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run FreeBSD VM
        uses: cross-platform-actions/action@v1.1.0
        with:
          operating_system: freebsd
          version: 14.2
          architecture: ${{ matrix.arch }}
          shell: sh
          run: |
            sh ./tools/metacall-environment.sh base python ${{ matrix.extra-loaders }} ruby go java cobol file rpc backtrace ${{ matrix.sanitizer }}
            mkdir -p build && cd build
            sh ../tools/metacall-configure.sh ${{ matrix.build }} ${{ matrix.sanitizer }} scripts python ${{ matrix.extra-loaders }} ruby go java cobol file rpc tests
            sh ../tools/metacall-build.sh ${{ matrix.build }} ${{ matrix.sanitizer }} ${{ matrix.extra-loaders }} ruby go java cobol file rpc tests
